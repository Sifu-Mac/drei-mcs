services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - mcs-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_NAME: ${APP_NAME}
      APP_HOST: ${APP_HOST}
      APP_URL: ${APP_URL}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      MAILER_FROM: ${MAILER_FROM}
      SOLID_QUEUE_IN_PUMA: ${SOLID_QUEUE_IN_PUMA}
      RAILS_ENV: ${RAILS_ENV}
      RAILS_LOG_TO_STDOUT: ${RAILS_LOG_TO_STDOUT}
      RAILS_SERVE_STATIC_FILES: ${RAILS_SERVE_STATIC_FILES}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY}
      PORT: ${PORT}
      DB_POOL: ${DB_POOL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
    volumes:
      - mcs-storage:/rails/storage
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.drei-mcs.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.drei-mcs.entrypoints=websecure
      - traefik.http.routers.drei-mcs.tls.certresolver=letsencrypt
      - traefik.http.services.drei-mcs.loadbalancer.server.port=3000

volumes:
  mcs-postgres:
  mcs-storage:
